## Overlay de producción: usa imágenes ya construidas y publicadas en el
## Docker Registry privado del servidor (docker-compose.registry.yml) en vez
## de compilar en la instancia. Se combina con docker-compose.yml:
##
##   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
##   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
##
## (sin --build: así Compose usa la imagen de "image:" en vez de reconstruir
## desde "build:". El "build:" de docker-compose.yml sigue ahí para cuando
## se quiera compilar local, por ej. en la notebook antes de publicar.)
##
## Requiere REGISTRY_HOST definido en .env, ej: REGISTRY_HOST=1.2.3.4:5000

services:
  plc-simulator:
    image: ${REGISTRY_HOST}/evolution-iot-demo-plc-simulator:latest

  collector:
    image: ${REGISTRY_HOST}/evolution-iot-demo-collector:latest

  plc-simulator-pinedo:
    image: ${REGISTRY_HOST}/evolution-iot-demo-plc-simulator-pinedo:latest

  collector-pinedo:
    image: ${REGISTRY_HOST}/evolution-iot-demo-collector-pinedo:latest

  processor:
    image: ${REGISTRY_HOST}/evolution-iot-demo-processor:latest
