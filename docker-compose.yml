version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: iot-timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_demo}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${TIMESCALEDB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_demo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iot-network

  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      POSTGRES_HOST: timescaledb
      POSTGRES_DB: ${POSTGRES_DB:-iot_demo}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - iot-network

  plc-simulator:
    build:
      context: ./apps/plc-simulator
      dockerfile: Dockerfile
    container_name: iot-plc-simulator
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PLC_SIMULATOR_PORT:-3001}:3001"
    networks:
      - iot-network
    restart: unless-stopped

  collector:
    build:
      context: ./apps/collector
      dockerfile: Dockerfile
    container_name: iot-collector
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PLC_SIMULATOR_URL: http://plc-simulator:3001
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-iot_demo}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
      COLLECTOR_INTERVAL_MS: ${COLLECTOR_INTERVAL_MS:-1000}
    depends_on:
      timescaledb:
        condition: service_healthy
      plc-simulator:
        condition: service_started
    networks:
      - iot-network
    restart: unless-stopped

  # --- Pinedo real: mismo mapa de registros que el M340 real (export Electroluz) ---
  # Corren en paralelo al simulador/collector de arriba, que siguen siendo la demo
  # "bonita" ya mostrada al cliente. Estos dos son la prueba de protocolo real:
  # Modbus TCP FC03 exacto, listos para apuntar a 172.16.16.180:502 el día que haya
  # conectividad con la planta (solo cambia PLC_HOST/PLC_PORT del collector-pinedo).
  plc-simulator-pinedo:
    build:
      context: ./apps/plc-simulator-pinedo
      dockerfile: Dockerfile
    container_name: iot-plc-simulator-pinedo
    environment:
      SIM_HOST: 0.0.0.0
      SIM_PORT: 502
      SIM_UNIT_ID: 255
      SIM_TICK_MS: 1000
    ports:
      - "${PLC_SIMULATOR_PINEDO_PORT:-5020}:502"
    networks:
      - iot-network
    restart: unless-stopped

  collector-pinedo:
    build:
      context: ./apps/collector-pinedo
      dockerfile: Dockerfile
    container_name: iot-collector-pinedo
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PLC_HOST: plc-simulator-pinedo
      PLC_PORT: 502
      PLC_UNIT_ID: 255
      MACHINE_NAME: PLC-PINEDO
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-iot_demo}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
      POLL_MS: ${COLLECTOR_PINEDO_INTERVAL_MS:-1000}
    depends_on:
      timescaledb:
        condition: service_healthy
      plc-simulator-pinedo:
        condition: service_started
    networks:
      - iot-network
    restart: unless-stopped

  processor:
    build:
      context: ./apps/processor
      dockerfile: Dockerfile
    container_name: iot-processor
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-iot_demo}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
      PROCESSOR_INTERVAL_MS: ${PROCESSOR_INTERVAL_MS:-5000}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - iot-network
    restart: unless-stopped

networks:
  iot-network:
    driver: bridge

volumes:
  timescaledb-data:
  grafana-data:
